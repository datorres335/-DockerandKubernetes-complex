services:
  client:
    image: "datorres335/multi-client"
    mem_limit: 128m
    hostname: client

  server:
    image: "datorres335/multi-server"
    mem_limit: 128m
    hostname: api
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - PGUSER=$PGUSER
      - PGHOST=$PGHOST
      - PGDATABASE=$PGDATABASE
      - PGPASSWORD=$PGPASSWORD
      - PGPORT=$PGPORT

  worker:
    image: "datorres335/multi-worker"
    mem_limit: 128m
    hostname: worker
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT

  nginx:
    image: "datorres335/multi-nginx"
    mem_limit: 128m
    hostname: nginx
    ports:
      - "80:80"
    depends_on:
      - client
      - server