name: Multi-Container CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build React test image
        run: docker build -t complex-client-test -f ./client/Dockerfile.dev ./client

      - name: Run React tests
        run: docker run -e CI=true complex-client-test npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build client production image
        run: docker build -t datorres335/multi-client ./client

      - name: Build NGINX production image
        run: docker build -t datorres335/multi-nginx ./nginx

      - name: Build server production image
        run: docker build -t datorres335/multi-server ./server

      - name: Build worker production image
        run: docker build -t datorres335/multi-worker ./worker

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-client ./client
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-nginx ./nginx
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-server ./server
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-worker ./worker

      - name: Push production images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-worker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            "node_modules/*"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deploy.zip \
            s3://elasticbeanstalk-us-east-2-688567283539/docker-multi/deploy-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "multi-docker" \
            --version-label "${{ github.sha }}" \
            --source-bundle \
            S3Bucket="elasticbeanstalk-us-east-2-688567283539",S3Key="docker-multi/deploy-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "Multi-docker-env" \
            --version-label "${{ github.sha }}"
